<div class="find-replace">
  <!-- Row 1: Find -->
  <div class="find-row">
    <div class="field">
      <i class="bc_icon bc_search field-icon"></i>
      <input type="text" placeholder="查找" [(ngModel)]="findText" (ngModelChange)="onFindTextChange()"
             (keydown.shift.enter)="findPrev()" (keydown.enter)="findNext()" (keydown.escape)="onClose.emit()"
             #findInput/>
      <span class="flag-group">
        <span class="flag-sep">/</span>
        @for (item of helper.regFlagList; track item.value) {
          <span class="flag" [class.active]="item.checked" [title]="item.title"
                (click)="onFlagChange(item)">{{ item.name }}</span>
        }
      </span>
    </div>

    <span class="match-info" [hidden]="!helper.matchedList.length">
      {{ helper.matchIndex + 1 }}/{{ helper.matchedList.length }}
    </span>

    <span class="nav-btn" [class.disabled]="!helper.matchedList.length"
          (mousedown)="$event.preventDefault(); findPrev()">
      <i class="bc_icon bc_shang"></i>
    </span>
    <span class="nav-btn" [class.disabled]="!helper.matchedList.length"
          (mousedown)="$event.preventDefault(); findNext()">
      <i class="bc_icon bc_xia"></i>
    </span>

    <span class="close-btn" (click)="onClose.emit()">
      <i class="bc_icon bc_guanbi"></i>
    </span>
  </div>

  @if (helper.nonReplaceableCount) {
    <div class="replace-summary" role="status">
      <span tabindex="0" [csTooltip]="helper.nonReplaceableTooltip">
        其中 {{ helper.nonReplaceableCount }} 项无法替换
      </span>
    </div>
  }

  <!-- Row 2: Replace (non-readonly) -->
  @if (!(doc.readonlySwitch$ | async)) {
    <div class="replace-row">
      <div class="field">
        <i class="bc_icon bc_file-search-02 field-icon"></i>
        <input type="text" placeholder="替换为" [(ngModel)]="replaceText" (keydown.escape)="onClose.emit()"/>
      </div>

      <fieldset class="replace-action" [disabled]="!helper.matchedList.length || helper.matchedList[helper.matchIndex]?.replaceable === false"
                [title]="helper.matchedList[helper.matchIndex]?.replaceDisabledReason || ''">
        <button cs-button csType="secondary" csSize="sm" class="action-btn" (click)="replaceOne()">替换</button>
      </fieldset>
      <fieldset class="replace-action" [disabled]="!helper.hasReplaceableMatches">
        <button cs-button csType="secondary" csSize="sm" class="action-btn" (click)="replaceAll()">全部</button>
      </fieldset>
    </div>
  }
</div>
