<!-- divider-style-popup.component.html -->
<div class="popup">
  <!-- Style Type Tabs -->
  <div class="tabs">
    <button *ngFor="let tab of styleTabs"
            [class.active]="activeTab === tab.key"
            (click)="setTab(tab.key)">
      <i [ngClass]="tab.icon"></i>
      {{ tab.label }}
    </button>
  </div>

  <!-- Line Type Selection -->
  <div class="line-options" *ngIf="activeTab === 'line'" >
    <div *ngFor="let style of lineStyles"
         class="line-style-item"
         [class.selected]="selectedStyle === style"
         (mousedown)="selectStyle(style)">
      <span class="line" [ngClass]="style" [attr.data-tab-size]="activeSize"></span>
    </div>
  </div>

  <!-- Pattern or Texture Selection -->
  <div class="patterns" *ngIf="activeTab === 'tape'">
    <div class="pattern-grid">
      <div *ngFor="let p of tapePatterns" [attr.data-tab-size]="activeSize"
           class="pattern-box" [ngClass]="p"
           [class.selected]="selectedStyle === p"
           (click)="selectStyle(p)">
      </div>
    </div>
  </div>

  <!-- Edge pattern strips (花边：小草/小花朵等图案条) -->
  <div class="patterns" *ngIf="activeTab === 'edge'">
    <div class="pattern-grid">
      <div *ngFor="let p of edgePatterns" [attr.data-tab-size]="activeSize"
           class="edge-box" [ngClass]="p"
           [class.selected]="selectedStyle === p"
           (click)="selectStyle(p)">
      </div>
    </div>
  </div>

  <!-- Text Label options -->
  <div class="text-options" *ngIf="activeTab === 'text'">
    <input class="text-input" type="text"
           [value]="labelText"
           placeholder="输入文字…"
           (mousedown)="$event.stopPropagation()"
           (input)="setText($any($event.target).value)" />
    <div class="align-row">
      <button *ngFor="let a of alignList"
              [class.active]="activeAlign === a.key"
              [title]="a.label"
              (mousedown)="setAlign(a.key)">
        <i [ngClass]="a.icon"></i>
      </button>
    </div>
    <div class="color-row">
      <button type="button" class="color-swatch default"
              [class.active]="!activeColor"
              (mousedown)="setColor('')" title="默认">A</button>
      <button type="button" *ngFor="let c of colors"
              class="color-swatch"
              [style.background]="c"
              [class.active]="activeColor === c"
              (mousedown)="setColor(c)" [title]="c"></button>
    </div>
  </div>

  <div class="tabs">
    <button *ngFor="let tab of sizeList" (mousedown)="selectSize(tab.key)"
            [class.active]="tab.key === activeSize">
      <i [ngClass]="tab.label"></i>
      {{ tab.label }}
    </button>
  </div>

</div>
