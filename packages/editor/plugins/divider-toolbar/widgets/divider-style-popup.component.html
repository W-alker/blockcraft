<!-- divider-style-popup.component.html -->
<div class="popup">
  <cs-segmented class="style-tabs"
                csSize="small"
                [csBlock]="true"
                [csOptions]="styleTabOptions"
                [ngModel]="activeTab"
                (ngModelChange)="setTab($event)"
                csAriaLabel="分割线样式类型" />

  <!-- Line Type Selection -->
  <div class="line-panel" *ngIf="activeTab === 'line'">
    <div class="line-options"
         [style.--bc-divider-preview-color]="activeLineColor || null">
      <button cs-button csType="text" csSize="sm" type="button"
              *ngFor="let style of lineStyles"
              class="line-style-item"
              [class.selected]="selectedStyle === style.key"
              [title]="style.label"
              (click)="selectStyle(style.key)">
        <span class="line" [ngClass]="style.key"
              [attr.data-tab-length]="activeLength"
              [attr.data-tab-thickness]="activeThickness"
              [style.opacity]="activeOpacity / 100"></span>
      </button>
    </div>
    <div class="line-color-options" aria-label="线条颜色">
      <span class="option-label">线色</span>
      <cs-color-picker csMode="palette" csSize="sm"
                       [csValue]="activeLineColor || null"
                       [csAllowClear]="true"
                       [csShowText]="true"
                       [csShowAlpha]="false"
                       (csValueChange)="setLineColor($event)" />
    </div>
  </div>

  <!-- Pattern or Texture Selection -->
  <div class="patterns" *ngIf="activeTab === 'tape'">
    <div class="pattern-grid">
      <button cs-button csType="text" type="button"
              *ngFor="let p of tapePatterns"
              [attr.data-tab-length]="activeLength"
              [attr.data-tab-thickness]="activeThickness"
              [style.opacity]="activeOpacity / 100"
              class="pattern-box" [ngClass]="p"
              [class.selected]="selectedStyle === p"
              (click)="selectStyle(p)">
      </button>
    </div>
  </div>

  <!-- Edge pattern strips (花边：小草/小花朵等图案条) -->
  <div class="patterns" *ngIf="activeTab === 'edge'">
    <div class="pattern-grid">
      <button cs-button csType="text" type="button"
              *ngFor="let p of edgePatterns"
              [attr.data-tab-length]="activeLength"
              [attr.data-tab-thickness]="activeThickness"
              [style.opacity]="activeOpacity / 100"
              class="edge-box" [ngClass]="p.key"
              [class.selected]="selectedStyle === p.key"
              [title]="p.label"
              (click)="selectStyle(p.key)">
      </button>
    </div>
  </div>

  <div class="appearance-controls" aria-label="分割线外观">
    <div class="appearance-row">
      <span class="option-label">长度</span>
      <cs-segmented class="segmented-control"
                    csSize="small"
                    [csBlock]="true"
                    [csOptions]="lengthOptions"
                    [ngModel]="activeLength"
                    (ngModelChange)="selectLength($any($event))"
                    csAriaLabel="分割线长度" />
    </div>
    <div class="appearance-row">
      <span class="option-label">粗细</span>
      <cs-segmented class="segmented-control"
                    csSize="small"
                    [csBlock]="true"
                    [csOptions]="thicknessOptions"
                    [ngModel]="activeThickness"
                    (ngModelChange)="selectThickness($any($event))"
                    csAriaLabel="分割线粗细" />
    </div>
    <div class="appearance-row opacity-row">
      <span class="option-label">透明度</span>
      <cs-slider [csMin]="10" [csMax]="100" [csStep]="5"
                 csAriaLabel="分割线透明度"
                 [csValue]="activeOpacity"
                 (csValueChange)="setOpacity($event)" />
      <output>{{ activeOpacity }}%</output>
    </div>
  </div>

</div>
