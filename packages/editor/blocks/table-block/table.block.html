<div class="table-scrollable bc-scrollable-container" #tableScrollable (scroll)="onScroll($event)">
  <div class="table-wrapper" #tableWrapper>
    <!--
      table-row-bar 跟 table-col-bar 一样放在 .table-wrapper 内部。
      containing block = .table-wrapper：自动跟随 wrapper 居中浮动 / CSS zoom 缩放 /
      水平滚动（horizontal scroll on .table-scrollable 移动 wrapper，row-bar 跟着移动）。
      不需要任何 JS 计算或同步。
    -->
    <table-row-bar [rowIds]="_childrenIds" [rowHeightsRecord]="_rowHeightsRecord"
                   [pageBreakGaps]="_pageBreakGaps"
                   [visibleHandleIndex]="_visibleRowHandle"
                   [selectedRange]="_activeRowRange"
                   (hoveredHandleChange)="onRowHandleHovered($event)"
                   (selectedRangeChange)="onRowBarSelected($event)"
                   (reorderStart)="onRowReorderStart($event)"
                   (reorderMove)="onRowReorderMove($event)"
                   (reorderEnd)="onRowReorderEnd($event)"
                   #rowBarComponent></table-row-bar>

    <div class="table-menu-anchor"
         #tableMenuAnchor
         [style.left.px]="_tableMenu.left + _tableMenu.width / 2"
         [style.top.px]="_tableMenu.top"
         [style.height.px]="_tableMenu.height"></div>

    <table-col-bar [colWidths]="props.colWidths"
                   [visibleHandleIndex]="_visibleColHandle"
                   [selectedRange]="_activeColRange"
                   (hoveredHandleChange)="onColHandleHovered($event)"
                   (selectedRangeChange)="onColBarSelected($event)"
                   (reorderStart)="onColReorderStart($event)"
                   (reorderMove)="onColReorderMove($event)"
                   (reorderEnd)="onColReorderEnd($event)"
                   #colBarComponent />

    <table>
      <colgroup>
        @for (w of props.colWidths; track $index) {
          <col [width]="w" />
        }
      </colgroup>

      <tbody class="children-render-container">
<!--        <ng-container #childrenContainer></ng-container>-->
      </tbody>
    </table>

    <!--
      独立于 td 的命中层。若把手柄 append 到 table-cell，WebKit 在
      border-collapse 边界会让右侧 td 的 painting layer 覆盖它，导致视觉上
      对准分隔线、实际事件目标却是单元格。overlay 作为 wrapper 的后置子层
      始终位于 table 之上，mousemove 时仅更新一次位置。
    -->
    <div class="table-col-resize-bar"
         contenteditable="false"
         data-bc-native-input
         #colResizeBar>
      <div class="bar"></div>
    </div>

    @if (_rowReorder) {
      <div class="table-row-drop-line"
           [style.top.px]="_rowReorder.dropLineTop"></div>
      <div class="table-row-drop-preview"
           [style.top.px]="_rowReorder.previewTop"
           [style.height.px]="_rowReorder.previewHeight"
           [style.width.px]="_rowReorder.previewWidth"></div>
    }

    @if (_colReorder) {
      <div class="table-col-drop-line"
           [style.left.px]="_colReorder.dropLineLeft"></div>
      <div class="table-col-drop-preview"
           [style.left.px]="_colReorder.previewLeft"
           [style.width.px]="_colReorder.previewWidth"
           [style.height.px]="_colReorder.previewHeight"></div>
    }
  </div>
</div>

@if (!isFullscreen) {
  <button class="bc-table-fullscreen-btn"
          type="button"
          contenteditable="false"
          aria-label="全屏"
          title="全屏"
          (mousedown)="$event.preventDefault()"
          (click)="toggleFullscreen(); $event.stopPropagation()">
    <i class="bc_icon bc_arrow-expand"></i>
  </button>
}

@if (isFullscreen) {
  <div class="bc-table-fullscreen-controls"
       contenteditable="false"
       (mousedown)="$event.preventDefault()">
    <button type="button"
            class="bc-table-fullscreen-controls__btn"
            [disabled]="!canZoomOut"
            title="缩小  ·  Ctrl/Cmd + 滚轮↓"
            (click)="fullscreenZoomOut(); $event.stopPropagation()">−</button>
    <button type="button"
            class="bc-table-fullscreen-controls__zoom"
            title="点击重置到 100%"
            (click)="resetFullscreenZoom(); $event.stopPropagation()">{{ zoomPercent }}%</button>
    <button type="button"
            class="bc-table-fullscreen-controls__btn"
            [disabled]="!canZoomIn"
            title="放大  ·  Ctrl/Cmd + 滚轮↑"
            (click)="fullscreenZoomIn(); $event.stopPropagation()">+</button>
    <span class="bc-table-fullscreen-controls__divider"></span>
    <button type="button"
            class="bc-table-fullscreen-controls__btn bc-table-fullscreen-controls__btn--text"
            title="适合宽度"
            (click)="fullscreenFitToWidth(); $event.stopPropagation()">适合</button>
    <span class="bc-table-fullscreen-controls__divider"></span>
    <button type="button"
            class="bc-table-fullscreen-controls__btn bc-table-fullscreen-controls__btn--text"
            aria-label="退出全屏"
            title="退出全屏  ·  Esc"
            (click)="toggleFullscreen(); $event.stopPropagation()">退出</button>
  </div>

  <div class="bc-table-fullscreen-menu"
       [class.is-visible]="_tableMenu.visible"
       contenteditable="false"
       (mousedown)="$event.preventDefault()">
    <table-structure-toolbar
      [table]="this"
      [rowIndex]="_tableMenu.rowIndex"
      [rowCount]="_tableMenu.rowCount"
      [colIndex]="_tableMenu.colIndex"
      [colCount]="_tableMenu.colCount"
      [selectionKind]="_tableMenu.selectionKind"
    />
  </div>
}
