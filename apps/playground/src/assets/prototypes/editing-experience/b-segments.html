<!doctype html><html lang="zh-CN"><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>B · 分段滑轨</title><style>
:root{color-scheme:light;--ink:#252936;--muted:#626779;--accent:#6550d9;--line:#e6e7ef;--panel:#fff;--soft:#f4f3fa}
*{box-sizing:border-box}body{margin:0;background:#f5f5f8;color:var(--ink);font-family:Inter,-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}main{max-width:550px;margin:auto;padding:32px 24px}header{display:flex;justify-content:space-between;align-items:center;gap:12px}h1{font-size:20px;margin:0;font-weight:650;letter-spacing:-.6px}.code{font:600 13px ui-monospace,monospace;color:var(--muted)}.intro{color:var(--muted);font-size:13px;line-height:1.8;margin:12px 0 26px}.control{padding:24px 20px 20px;background:var(--panel);border:1px solid var(--line);border-radius:20px;box-shadow:0 10px 35px #25293606}.readout{display:flex;align-items:center;justify-content:space-between;gap:10px}.readout strong{font-size:19px;letter-spacing:-.4px}.counter{font:500 12px ui-monospace,monospace;color:var(--muted)}.status{color:var(--muted);font-size:12px;margin-top:7px;min-height:18px}.track{position:relative;height:96px;touch-action:pan-y;user-select:none;cursor:pointer;--p:50%;--smooth:180ms}.track.dragging{--smooth:0ms;cursor:grabbing}.rail{position:absolute;left:16px;right:16px;top:49px;height:8px;border-radius:20px;background:#e9e7f3}.fill{height:100%;width:var(--p);background:var(--accent);border-radius:inherit;transition:width var(--smooth) ease}.thumb{pointer-events:none;position:absolute;left:calc(16px + (100% - 32px) * var(--ratio));top:39px;width:28px;height:28px;transform:translateX(-50%);border-radius:50%;background:white;border:5px solid var(--accent);box-shadow:0 3px 8px #31226430;transition:left var(--smooth) ease,box-shadow 180ms}.track:focus-visible{outline:3px solid #a698ff;outline-offset:5px;border-radius:10px}.ticks{position:absolute;left:16px;right:16px;top:49px;display:flex;justify-content:space-between;pointer-events:none}.ticks i{width:8px;height:8px;background:#c8c5d9;border:2px solid white;border-radius:50%}.ticks i.past{background:var(--accent)}.labels{display:grid;grid-template-columns:repeat(5,minmax(0,1fr));gap:2px;margin:0 -12px}button{font:inherit;cursor:pointer}.labels button{border:0;border-radius:10px;color:var(--muted);font-size:12px;padding:12px 0;background:transparent;min-height:44px;transition:background 160ms,color 160ms}.labels button[aria-pressed=true]{color:var(--accent);background:var(--soft);font-weight:650}.labels button:hover{background:var(--soft)}button:focus-visible{outline:2px solid var(--accent);outline-offset:2px}.description{font-size:13px;line-height:1.8;color:var(--muted);min-height:47px;margin:18px 0 0;border-top:1px solid var(--line);padding-top:16px}.preview{margin-top:22px;border:1px solid var(--line);border-radius:12px;padding:16px;background:var(--panel);display:grid;grid-template-columns:1fr 84px;gap:20px;align-items:center}.preview p{font-size:12px;color:var(--muted);margin:0 0 8px}.preview strong{font-size:13px;font-weight:500;line-height:1.6}.object{width:80px;height:58px;border:1px solid transparent;border-radius:5px;display:grid;place-items:center;position:relative;transform:rotate(-6deg);transition:border-color 160ms;background:var(--soft);color:var(--accent);font:italic 600 21px Georgia,serif}.object i{display:none;width:5px;height:5px;background:white;border:1px solid var(--accent);position:absolute}.object i:nth-child(1){left:-3px;top:-3px}.object i:nth-child(2){right:-3px;top:-3px}.object i:nth-child(3){left:-3px;bottom:-3px}.object i:nth-child(4){right:-3px;bottom:-3px}.preview[data-level="3"] .object,.preview[data-level="4"] .object{border-color:var(--accent)}.preview[data-level="3"] .object i,.preview[data-level="4"] .object i{display:block}.foot{font-size:11px;color:var(--muted);line-height:1.8;margin:18px 0 0}.bubble{position:absolute;left:calc(16px + (100% - 32px) * var(--ratio));top:1px;transform:translateX(-50%);white-space:nowrap;font-size:11px;background:var(--ink);color:white;border-radius:7px;padding:5px 9px;opacity:0;transition:opacity 100ms;pointer-events:none}.dragging .bubble{opacity:1}@media(max-width:380px){main{padding:24px 14px}.control{padding:20px 16px}.intro{margin-bottom:20px}.labels button{font-size:11px}}@media(prefers-reduced-motion:reduce){*,*:before,*:after{transition:none!important}}

:root{--accent:#255a53;--soft:#e9f2ef}.control{border-radius:14px}.track{height:76px;margin:22px -6px 8px;background:#eef2f0;border:1px solid #e0e8e3;border-radius:12px;overflow:hidden}.rail,.ticks{display:none}.thumb{left:calc(10% + 80% * var(--ratio));width:calc(20% - 8px);height:64px;top:5px;border:0;border-radius:9px;background:#255a53;box-shadow:0 3px 8px #1b45372b}.thumb:after{content:"";position:absolute;left:calc(50% - 8px);bottom:8px;width:16px;height:3px;border-radius:4px;background:#ffffff6b}.bubble{display:none}.segments{position:absolute;inset:0;display:grid;grid-template-columns:repeat(5,1fr);pointer-events:none;align-items:center;text-align:center;font-size:12px;color:#52695f}.segments span{position:relative;z-index:1;line-height:1.8;transition:color 80ms}.segments span.active{color:white;font-weight:600}.segments small{display:block;font:10px ui-monospace,monospace;opacity:.7}.labels{margin-top:0}.counter{background:#e9f2ef;padding:5px 8px;border-radius:5px}.track:focus-visible{outline-color:#5a9d8e}.dragging .thumb{background:#1b4e46}
</style><body data-style="B"><main><header><h1>分段滑轨</h1><span class="code">B / CSES</span></header><p class="intro">大面积选档。整段都能点，按住选中块也可以拖动。</p><section class="control" aria-label="编辑体验选择"><div class="readout"><strong>图文混排</strong><span class="counter">03 / 05</span></div><div class="status">已选用 · 图文混排</div><div class="track" role="slider" tabindex="0" aria-label="编辑体验档位" aria-valuemin="1" aria-valuemax="5" aria-valuenow="3" aria-valuetext="图文混排"><div class="rail"><div class="fill"></div></div><div class="ticks" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div><div class="thumb"></div><div class="segments" aria-hidden="true"><span>专注<small>01</small></span><span>轻编<small>02</small></span><span>混排<small>03</small></span><span>布局<small>04</small></span><span>设计<small>05</small></span></div><div class="bubble" aria-hidden="true"></div></div><div class="labels"><button type="button" aria-label="专注内容" aria-pressed="false">专注</button><button type="button" aria-label="轻量编辑" aria-pressed="false">轻编</button><button type="button" aria-label="图文混排" aria-pressed="true">混排</button><button type="button" aria-label="布局调整" aria-pressed="false">布局</button><button type="button" aria-label="精细设计" aria-pressed="false">设计</button></div><p class="description"></p></section><div class="preview" data-level="2"><div><p>体验示意</p><strong></strong></div><div class="object" aria-hidden="true">Aa<i></i><i></i><i></i><i></i></div></div><p class="foot">点击档位或拖动 · 方向键逐档切换<br>仅演示控件手感，未连接编辑器配置。</p><span id="announcement" aria-live="polite" style="position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%)"></span></main><script>
const names=['专注内容','轻量编辑','图文混排','布局调整','精细设计'];
const descriptions=['把注意力留给正文，收起对象边框与布局工具。','保持轻量排版工具，减少移动对象和组合块的干扰。','兼顾正文输入与对象编辑，按需显示对象操作。','聚焦对象时显示尺寸控制，方便调整图文位置。','增加悬停提示和布局控制，便于精细处理对象。'];
const track=document.querySelector('.track'), buttons=[...document.querySelectorAll('.labels button')];
let selected=2,position=2,gesture=null;
function render(p,preview=false){
 position=Math.max(0,Math.min(4,p));const near=Math.round(position);
 track.style.setProperty('--p',position/4*100+'%');track.style.setProperty('--ratio',position/4);
 track.setAttribute('aria-valuenow',near+1);track.setAttribute('aria-valuetext',names[near]);
 document.querySelector('.readout strong').textContent=names[near];
 document.querySelector('.counter').textContent=String(near+1).padStart(2,'0')+' / 05';
 document.querySelector('.status').textContent=preview?'松手选用 · '+names[near]:'已选用 · '+names[near];
 document.querySelector('.bubble').textContent=names[near];
 document.querySelector('.description').textContent=descriptions[near];
 document.querySelector('.preview').dataset.level=near;
 document.querySelector('.preview strong').textContent=['专心写下此刻的想法。','轻松整理文字与格式。','让文字和画面一起表达。','调整位置，让版面更有序。','每个细节，都恰到好处。'][near];
 buttons.forEach((b,i)=>b.setAttribute('aria-pressed',String(i===near)));
 document.querySelectorAll('.ticks i').forEach((t,i)=>t.classList.toggle('past',i<=near));
 document.querySelectorAll('.segments span').forEach((t,i)=>t.classList.toggle('active',i===near));
}
function choose(i){selected=Math.max(0,Math.min(4,i));render(selected);document.querySelector('#announcement').textContent='已选用'+names[selected];}
function fromX(x){const g=gesture;let value=Math.max(0,Math.min(4,(x-g.left)/g.width*4));return document.body.dataset.style==='C'?Math.round(value):value;}
function finish(cancel=false){if(!gesture)return;const id=gesture.id;const final=cancel?selected:Math.round(position);gesture=null;track.classList.remove('dragging');choose(final);if(track.hasPointerCapture(id))track.releasePointerCapture(id);}
track.addEventListener('pointerdown',e=>{if(e.button!==0||!e.isPrimary||gesture)return;const r=track.getBoundingClientRect();const inset=document.body.dataset.style==='B'?r.width*.1:16;gesture={id:e.pointerId,left:r.left+inset,width:r.width-inset*2};track.setPointerCapture(e.pointerId);track.classList.add('dragging');track.focus({preventScroll:true});render(fromX(e.clientX),true);e.preventDefault();});
track.addEventListener('pointermove',e=>{if(gesture?.id===e.pointerId)render(fromX(e.clientX),true);});
track.addEventListener('pointerup',e=>{if(gesture?.id!==e.pointerId)return;render(fromX(e.clientX),true);finish();});
track.addEventListener('pointercancel',()=>finish(true));
track.addEventListener('lostpointercapture',()=>{if(gesture)finish(true);});
window.addEventListener('blur',()=>finish(true));
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&gesture){finish(true);e.preventDefault();}});
track.addEventListener('keydown',e=>{const key=e.key;let next=selected;if(['ArrowRight','ArrowUp','PageUp'].includes(key))next++;else if(['ArrowLeft','ArrowDown','PageDown'].includes(key))next--;else if(key==='Home')next=0;else if(key==='End')next=4;else return;e.preventDefault();finish(true);choose(next);});
buttons.forEach((b,i)=>b.addEventListener('click',()=>{finish(true);choose(i);}));render(2);
</script></body></html>
