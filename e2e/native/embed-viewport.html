<!doctype html>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<style>html,body{margin:0}main{width:100vw;height:100vh;background:linear-gradient(135deg,cyan,pink)}</style>
<main><input value="keep state"></main>
<script>
  const session = Math.random().toString(36)
  function report() {
    parent.postMessage({embedProbe: true, session, width: innerWidth, height: innerHeight,
      main: document.querySelector('main').getBoundingClientRect().toJSON(),
      value: document.querySelector('input').value}, '*')
  }
  addEventListener('resize', report)
  addEventListener('message', report)
  report()
</script>
